<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Minecraft - 网页版我的世界</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #87CEEB;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 5;
      font-family: monospace;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 5;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }

    #crosshair::before {
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
      width: 2px;
      height: 60%;
    }

    #crosshair::after {
      top: 50%;
      left: 20%;
      transform: translateY(-50%);
      height: 2px;
      width: 60%;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 5;
    }

    canvas {
      display: block;
    }

    /* Settings Menu */
    #settings-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      z-index: 20;
      min-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid #888;
    }

    #settings-menu h2 {
      margin-bottom: 20px;
      color: #ffff55;
      text-shadow: 2px 2px 0 #3f3f3f;
    }

    .menu-section {
      margin-bottom: 20px;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    .menu-section h3 {
      margin-bottom: 10px;
      color: #aaa;
    }

    button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      background: #555;
      color: white;
      border: 2px solid #000;
      border-top-color: #888;
      border-left-color: #888;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
    }

    button:hover {
      background: #666;
    }

    button:active {
      background: #444;
      border-top-color: #000;
      border-left-color: #000;
      border-bottom-color: #888;
      border-right-color: #888;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      text-align: left;
    }

    .item-checkbox {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    /* Save List */
    .save-list {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.3);
    }

    .save-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #555;
    }

    .save-item:last-child {
      border-bottom: none;
    }

    .save-info {
      text-align: left;
    }

    .save-name {
      font-weight: bold;
      color: #fff;
    }

    .save-date {
      font-size: 12px;
      color: #aaa;
    }

    .save-actions {
      display: flex;
      gap: 5px;
    }

    .save-actions button {
      width: auto;
      padding: 5px 10px;
      font-size: 12px;
      margin: 0;
    }

    /* Hotbar */
    #hotbar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 5px;
      z-index: 10;
    }

    .hotbar-slot {
      width: 40px;
      height: 40px;
      border: 2px solid #888;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
      cursor: pointer;
      position: relative;
    }

    .hotbar-slot.active {
      border-color: white;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .hotbar-slot span {
      position: absolute;
      top: 2px;
      left: 2px;
      font-size: 10px;
      color: #ddd;
    }

    .block-icon {
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .block-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="loading">加载中...</div>

    <div id="settings-menu" style="display: none;">
      <h2>游戏菜单</h2>
      <div class="menu-section">
        <h3>游戏进度</h3>
        <button id="btn-resume">继续游戏</button>
        <button id="btn-save">新建存档</button>
        <div id="save-status"></div>
        <div id="save-list" class="save-list">
          <!-- Save slots injected here -->
        </div>
      </div>
      <div class="menu-section">
        <h3>可用物品 (勾选以添加到快捷栏)</h3>
        <div id="item-selection" class="item-grid">
          <!-- Items will be injected here by JS -->
        </div>
      </div>
    </div>

    <div id="hotbar">
      <!-- Hotbar slots will be injected here by JS -->
    </div>

    <div id="hud" style="display: none;">
      <div>FPS: <span id="fps">60</span></div>
      <div>位置: <span id="position">0, 0, 0</span></div>
      <div>区块: <span id="chunk">0, 0</span></div>
      <div id="debug" style="color: yellow; font-size: 12px; margin-top: 5px;"></div>
    </div>

    <div id="crosshair" style="display: none;"></div>

    <div id="instructions" style="display: none;">
      点击屏幕开始游戏<br>
      WASD - 移动 | 空格 - 跳跃 | Shift - 下降<br>
      鼠标 - 视角 | 左键 - 破坏方块 | 右键 - 放置方块<br>
      ESC - 菜单 / 释放鼠标 | 1-9 - 选择物品
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
